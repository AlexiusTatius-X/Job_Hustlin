# Target companies for the job-scout skill.
#
# Fields per entry:
#   name         : display name
#   tier         : scan cadence (A | B | C) — how often this company is scanned:
#                    A = every run (3x/day)
#                    B = once/day — only the day's first (morning) run
#                    C = ~2x/week — only the first run on Monday & Thursday
#                  See config/profile.md + SKILL.md step 3 for the exact time rule.
#   ats          : applicant-tracking system → picks the reference file
#                  (workday | greenhouse | lever | ashby | smartrecruiters |
#                   icims | oracle | successfactors | eightfold | custom)
#   careers_url  : stable careers landing/search page
#   listing_url  : optional; a VERIFIED GET-able listing (ATS API or search page). When set,
#                  scrape exactly this URL for the listing; do not guess other endpoints.
#   wait_for     : optional; pass as Firecrawl `waitFor` (ms) — required for Workday pages,
#                  which otherwise return only a "Loading" shell.
#   enabled      : optional; false = skip this company entirely.
#   notes        : optional; "# verify" ATS is confirmed on first build run via Firecrawl map
#
# The skill applies GLOBAL filters from config/profile.md (SDE-family role, 0-2 yrs,
# on-site India: Bengaluru/Hyderabad/Noida/Gurgaon). Do not add per-company filters here.
#
# Adding a company = one line. Unknown/odd ATS → set ats: custom (skill uses ats-generic.md).

big_tech:
